name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make verify
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y libnss3-tools
      - run: make verify-auth | tee /tmp/nas-auth.log
        shell: bash
        env:
          NAS_AUTH_DISPOSABLE_TRUST: '1'
      - run: make verify-ui | tee /tmp/nas-ui.log
        shell: bash
      - run: python3 -B scripts/ui_screenshot_evidence.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nas-ui-${{ github.sha }}
          path: |
            /tmp/nas-ui.log
            /tmp/nas-auth.log
            /tmp/asuka-auth-*.png
            /tmp/asuka-naming-*.png
            /tmp/asuka-workflow-*.png
          retention-days: 14
