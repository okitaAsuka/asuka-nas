# Linux NAS 默认 host/回环候选；HTTPS 另需明确私密配置、可信 TLS 只读挂载和独立 verifier。
services:
  asuka-nas:
    image: ${NAS_IMAGE:?use the packaged .env}
    platform: ${NAS_PLATFORM:?use the packaged .env}
    pull_policy: never
    network_mode: host
    user: "${NAS_UID:-65532}:${NAS_GID:-65532}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    command: ["-serve", "-config", "/config/config.json"]
    env_file: ./credentials.env
    volumes:
      - type: bind
        source: ./config.json
        target: /config/config.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${NAS_STATE_DIR:?set existing writable state directory}
        target: /data/asuka-nas
        bind: {create_host_path: false}
      - type: bind
        source: ${NAS_MEDIA_ROOT:?set existing common media root}
        target: /media
        bind: {create_host_path: false}
